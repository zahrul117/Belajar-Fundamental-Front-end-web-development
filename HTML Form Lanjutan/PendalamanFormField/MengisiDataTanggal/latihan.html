<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
      }

      .container {
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background-color: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      label {
        margin-bottom: 8px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="date"],
      input[type="time"],
      input[type="datetime-local"] {
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }

      button[type="submit"] {
        padding: 10px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button[type="submit"]:hover {
        background-color: #45a049;
      }

      .form-group {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <form action="" method="post">
      <label for="kegiatan">Nama Kegiatan : </label>
      <input type="text" id="kegiatan" name="kegiatan" />
      <label for="lokasi">Lokasi Acara : </label>
      <input type="text" id="lokasi" name="lokasi" />
      <label for="tanggal">Tanggal Pelaksanaan : </label>
      <input type="date" id="tangal" name="tanggal" />
      <label for="mulai">Waktu Mulai : </label>
      <input type="time" id="mulai" name="mulai" />
      <label for="akhir">Waktu Berakhir : </label>
      <input type="time" id="akhir" name="akhir" />
      <label for="tanggalJam">Tanggal dan Jam Pengingat : </label>
      <input type="datetime-local" id="tanggalJam" name="tanggalJam" />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
