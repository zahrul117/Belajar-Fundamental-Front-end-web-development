<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Form Komentar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: horizontal; /* Hanya bisa resize vertikal */
      padding: 10px;
      font-size: 1em;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Formulir Umpan Balik</h2>
  <form action="#" method="post">
    <label for="komentar">Komentar atau Saran Anda:</label>
    <textarea id="komentar" name="komentar" placeholder="Tulis komentar Anda di sini..." required></textarea>

    <button type="submit">Kirim</button>
  </form>

</body>
</html>
