<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Tanggal dan Waktu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 10px;
    }

    button {
      cursor: pointer;
      padding: 10px 20px;
      font-size: 1em;
    }
  </style>
</head>
<body>

  <h2>Form Pengisian Tanggal dan Waktu</h2>
  <form action="#" method="post">
    
    <label for="tanggal">Tanggal (Pilih Tanggal):</label>
    <input type="date" id="tanggal" name="tanggal" required>

    <label for="waktu">Waktu (Pilih Waktu):</label>
    <input type="time" id="waktu" name="waktu" required>

    <label for="tanggal_waktu">Tanggal dan Waktu (Pilih Tanggal dan Waktu):</label>
    <input type="datetime-local" id="tanggal_waktu" name="tanggal_waktu" required>

    <button type="submit">Kirim</button>
  </form>

</body>
</html>
