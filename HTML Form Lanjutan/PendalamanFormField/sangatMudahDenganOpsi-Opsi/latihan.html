<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f2f2f2;
          padding: 20px;
        }
      
        form {
          background-color: white;
          padding: 20px;
          border-radius: 8px;
          max-width: 500px;
          margin: auto;
          box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
      
        label {
          display: block;
          margin-top: 10px;
          margin-bottom: 4px;
          font-weight: bold;
        }
      
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="time"],
        input[list],
        select {
          width: 100%;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
        }
      
        input[type="radio"],
        input[type="checkbox"] {
          margin-right: 5px;
        }
      
        button {
          margin-top: 15px;
          background-color: #007bff;
          color: white;
          border: none;
          padding: 10px 16px;
          border-radius: 4px;
          cursor: pointer;
        }
      
        button:hover {
          background-color: #0056b3;
        }
      </style>
      
  </head>
  <body>
    <form action="">
    <label for="nama">Nama Lengkap : </label>
    <input type="text" id="nama" name="nama" /><br />
    <label for="jenisKelamin">Jenis Kelamin : </label>
    <label for="pria"
      ><input type="radio" value="pria" name="jenisKelamin" />Pria</label
    >
    <label for="wanita"
      ><input type="radio" value="wanita" name="jenisKelamin" /> Wanita</label
    ><br />
    <label for="hobi">Hobi : </label>
    <label for="Bersepeda"
      ><input type="checkbox" value="Bersepeda" name="hobi" />Bersepeda</label
    >
    <label for="BermainMusik"
      ><input type="checkbox" value="BermainMusik" name="hobi" />Bermain
      Musik</label
    >
    <label for="Membaca"
      ><input type="checkbox" value="Membaca" name="hobi" />Membaca</label
    ><br />
    <label for="kegiatan">Pilih Kegiatan Yang Diinginkan : </label>
    <select name="kegiatan" id="kegiatan">
      <option value="" selected disabled>Pilih Kegiatan</option>
      <option value="Workshop">Workshop</option>
      <option value="Seminar">Seminar</option>
      <option value="Outing">Outing</option></select
    ><br />
    <label for="tanggal">Masukkan Tanggal Kegiatan : </label>
    <input type="date" id="tanggal" name="tanggal" /><br />
    <label for="waktu"> Masukkan Waktu Kegiatan : </label>
    <input type="time" id="waktu" name="waktu" /><br />
    <label for="email">Email Anda : </label>
    <input type="email" id="email" name="email" /><br />
    <label for="negara">Masukkan Negara Anda : </label>
    <input list="negara" />
    <datalist id="negara">
      <option value="indonesia">Indonesia</option>
      <option value="jepang">Jepang</option>
      <option value="Swiss">Swiss</option></datalist
    ><br />
    <label for="setuju">Syarat dan Ketentuan : </label>
    <input type="checkbox" /><br>
    <button type="submit">kirim</button>
    </form>
  </body>
</html>
