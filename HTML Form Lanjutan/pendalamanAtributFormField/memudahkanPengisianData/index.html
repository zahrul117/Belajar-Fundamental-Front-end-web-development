<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Kartu</title>
  </head>
  <body>
    <form action="">
      <label for="kartu">Nomor Kartu Pembayaran:</label><br />
      <input
        type="text"
        id="kartu"
        name="kartu"
        inputmode="numeric"
        enterkeyhint="done"
        placeholder="Contoh: 1234 5678 9012 3456"
        required
      />
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
