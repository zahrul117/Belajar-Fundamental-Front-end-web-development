<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="email">Email : </label>
      <input type="email" id="email" name="email" />
      <button type="button" id="cekEmail">Tampilkan Email</button>
    </form>

    <script>
      const form = document.querySelector("form");
      const emailInput = form.elements.email; //ambil input dengan name=email
      const tombol = document.getElementById("cekEmail");

      tombol.addEventListener("click", () => {
        alert("email yang dimasukan : " + emailInput.value);
      });
    </script>
  </body>
</html>
