<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <label for="item">Jumlah item : </label>
      <input type="number" min="1" max="20" step="2" id="item" name="item" />
      <label for="nama">Nama pengguna : </label>
      <input type="text" minlength="3" maxlength="12" id="nama" name="nama" />
      <label for="pass">Masukkan Password : </label>
      <input
        type="password"
        minlength="8"
        maxlength="20"
        name="pass"
        id="pass"
      />
      <button>kirim</button>
    </form>
  </body>
</html>
